name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend unittest (no live infra)
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU torch first
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend suite
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend unit + Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Install headless Edge
        run: npx playwright install --with-deps msedge
      - name: Run Playwright e2e
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  docker:
    name: Docker build + config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev compose
        run: docker compose config --quiet
      - name: Validate prod compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        run: docker build --tag rag-learning-backend:ci .
      - name: Build frontend image
        run: docker build --tag rag-learning-frontend:ci frontend
      - name: Build Chroma image
        run: docker build --tag rag-learning-chroma:ci chroma
